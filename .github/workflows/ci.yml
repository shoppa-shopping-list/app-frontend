name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, stylelint, format:check, typecheck, api:check, test:ci]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [checks]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
  e2e:
    name: Playwright / Chromium + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: app-frontend
      - uses: actions/checkout@v7
        with:
          repository: shoppa-shopping-list/app-backend
          ref: 0dbbc7367ef600ae1d49a941c6d638276051158c
          path: app-backend
          token: ${{ secrets.BACKEND_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: app-frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            app-frontend/package-lock.json
            app-backend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: app-backend
      - name: Check backend contract snapshot
        run: cmp openapi.json ../app-backend/openapi.json
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
  # Frontend ships inside the backend's release tarball, so a green main here re-runs
  # app-backend's CI on its main, whose release job publishes a build malina pulls.
  # BACKEND_DEPLOY_TOKEN: fine-grained PAT, only app-backend, only Actions: read & write.
  trigger-deploy:
    name: Trigger backend deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Dispatch app-backend CI on main
        env:
          GH_TOKEN: ${{ secrets.BACKEND_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::BACKEND_DEPLOY_TOKEN not set — skipping deploy trigger"
            exit 0
          fi
          gh workflow run ci.yml -R shoppa-shopping-list/app-backend --ref main
